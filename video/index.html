<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wan 2.1 AI Studio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#07142b;
  color:#fff;
  padding:16px;
}
.card{
  background:#10224b;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
}
h1{font-size:34px;margin:8px 0 18px}
h2{font-size:22px;margin-bottom:12px}
label{display:block;margin:10px 0 6px;font-weight:bold}
textarea,input,select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1a2d63;
  color:#fff;
}
textarea{height:120px;resize:none}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}
.purple{background:linear-gradient(90deg,#5b6cff,#b52cff)}
.green{background:#00c853}
.orange{background:#ff9800}
.red{background:#e53935}
.progress{
  width:100%;
  height:10px;
  border-radius:20px;
}
.small{font-size:14px;color:#b8c4ff}
</style>
</head>

<body>

<h1>🎬 Wan 2.1 AI Studio</h1>

<div class="card">
  <h2>Prompt</h2>

  <label>Describe Video</label>
  <textarea id="prompt"
placeholder="Describe your cinematic video..."></textarea>

  <label>Reference Image</label>
  <input id="img" placeholder="Image URL (optional)">
</div>

<div class="card">
  <h2>Advanced Settings</h2>

  <div class="grid">
    <div>
      <label>Resolution</label>
      <select id="resolution">
        <option>1080P</option>
        <option>4K</option>
      </select>
    </div>

    <div>
      <label>FPS</label>
      <select id="fps">
        <option>24</option>
        <option>30</option>
        <option>60</option>
      </select>
    </div>

    <div>
      <label>Duration</label>
      <select id="duration">
        <option>8</option>
        <option>12</option>
        <option>16</option>
      </select>
    </div>

    <div>
      <label>Aspect</label>
      <select id="aspect">
        <option>9:16</option>
        <option>16:9</option>
        <option>1:1</option>
      </select>
    </div>
  </div>
</div>

<div class="card">
  <h2>🎤 Voice Clone</h2>

  <input type="file" accept=".wav,.mp3">
  <p class="small">WAV / MP3 (optional)</p>
</div>

<button
  class="btn purple"
  id="generateBtn"
  onclick="gen()">
  🎬 Generate Video
</button>

<button class="btn purple" id="extendBtn">
➕ Extend Video
</button>

<div class="grid">
  <button class="btn green" id="downloadBtn">⬇ Download</button>
  <button class="btn orange" id="newBtn">🆕 New</button>
</div>

<button class="btn red" id="deleteBtn">🗑 Delete</button>

<div class="card">
  <h2 id="stage">Ready</h2>

  <h1 id="percent">0%</h1>

  <progress id="bar" class="progress" value="0" max="100"></progress>

  <p class="small">ETA: <span id="eta">0 sec</span></p>
</div>
<script>
let lastJob="", lastVideo="";

async function gen(){
  try{
    const r = await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        prompt:prompt.value,
        image:img.value,
        resolution:resolution.value,
        fps:fps.value,
        duration:duration.value,
        aspect:aspect.value
      })
    });

    const txt = await r.text();

if (!txt.trim().startsWith("{")) {
  alert(txt);      // असली server error दिखेगा
  return;
}

const d = JSON.parse(txt);

if (!d.name) {
  alert(d.error || "API Error");
  return;
}



    lastJob = d.name;

    const t = setInterval(async()=>{
      const s = await (await fetch("/api/status?id="+lastJob)).json();

      percent.innerText = (s.progress||0)+"%";
      bar.value = s.progress||0;
      eta.innerText = (s.eta||0)+" sec";

      if(s.done){
        clearInterval(t);
        lastVideo = s.videoUrl;
        downloadBtn.href = lastVideo;
        status.innerText = "Ready";
      }
    },2000);

  }catch(e){
    alert(e.message);
  }
}

function newVideo(){
  prompt.value="";
  img.value="";
  percent.innerText="0%";
  bar.value=0;
  eta.innerText="0 sec";
  status.innerText="Ready";
}

function deleteVideo(){ newVideo(); }
</script>
</body>
</html>
