<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video</title>
<style>
body{background:#0b1020;color:#fff;font-family:Arial;padding:20px}
textarea,input,button{width:100%;margin:10px 0;padding:12px;border-radius:10px}
button{background:#7c3aed;color:#fff;border:0}
#out{margin-top:15px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Wan 2.1 AI Video</h2>
<input id="img" placeholder="Image URL (optional)">
<textarea id="prompt" rows="4" placeholder="Describe your video..."></textarea>
<button onclick="gen()">Generate</button>
<div id="out"></div>

<script>
async function gen() {
  const out = document.getElementById("out");
  const prompt = document.getElementById("prompt").value;
  const image = document.getElementById("img").value;

  out.innerHTML = "⏳ 0% | ETA: 3:00";

  const timer = setInterval(() => {
    const t = out.innerText.match(/(\d+)%/);
    let p = t ? parseInt(t[1]) : 0;
    if (p < 95) {
      p += 5;
      out.innerHTML = `⏳ ${p}% | ETA: ${Math.max(0, Math.ceil((100-p)/5))} min`;
    }
  }, 8000);

  const r = await fetch("/api/generate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ prompt, image })
  });

  clearInterval(timer);
  const d = await r.json();

  out.innerHTML = "✅ 100% Complete\n\n" + JSON.stringify(d, null, 2);
}
</script>
