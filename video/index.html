<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wan 2.1 AI Studio</title>
<style>
body{font-family:Arial;background:#07142b;color:#fff;padding:16px}
.card{background:#10224b;border-radius:16px;padding:16px;margin-bottom:16px}
textarea,input,select{width:100%;padding:12px;margin-top:8px;background:#1a2d63;color:#fff;border:none;border-radius:10px}
textarea{height:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px;color:#fff;font-weight:bold}
.purple{background:#6c4cff}.green{background:#00c853}.orange{background:#ff9800}.red{background:#e53935}
progress{width:100%;height:10px}
</style>
</head>
<body>

<h1>🎬 Wan 2.1 AI Studio</h1>

<div class="card">
<h2>Prompt</h2>
<textarea id="prompt" placeholder="Describe your cinematic video..."></textarea>
<input id="img" placeholder="Image URL (optional)">
</div>

<div class="card">
<div class="grid">
<select id="resolution"><option>1080P</option><option>4K</option></select>
<select id="fps"><option>24</option><option>30</option></select>
<select id="duration"><option>8</option><option>12</option></select>
<select id="aspect"><option>9:16</option><option>16:9</option></select>
</div>
</div>

<button class="btn purple" onclick="gen()">🎬 Generate Video</button>

<div class="grid">
<button class="btn green" id="downloadBtn">⬇ Download</button>
<button class="btn orange" onclick="newVideo()">🆕 New</button>
</div>

<div class="card">
<h2 id="stage">Ready</h2>
<h1 id="percent">0%</h1>
<progress id="bar" value="0" max="100"></progress>
<p>ETA: <span id="eta">0 sec</span></p>
</div>

<script>
const stage=document.getElementById("stage");
const prompt=document.getElementById("prompt");
const img=document.getElementById("img");
const resolution=document.getElementById("resolution");
const fps=document.getElementById("fps");
const duration=document.getElementById("duration");
const aspect=document.getElementById("aspect");
const percent=document.getElementById("percent");
const bar=document.getElementById("bar");
const eta=document.getElementById("eta");
const downloadBtn=document.getElementById("downloadBtn");

let lastJob="",lastVideo="";

async function gen(){
 try{
  stage.innerText="Generating...";

  const r=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    prompt:prompt.value,
    image:img.value,
    resolution:resolution.value,
    fps:fps.value,
    duration:duration.value,
    aspect:aspect.value
   })
  });

  const d=await r.json();

  if(!r.ok){
    alert(d.error||"API Error");
    stage.innerText="Ready";
    return;
  }

  lastJob=d.name;

  const timer=setInterval(async()=>{
    const s=await (await fetch("/api/status?id="+lastJob)).json();

    percent.innerText=(s.progress||0)+"%";
    bar.value=s.progress||0;
    eta.innerText=(s.eta||0)+" sec";

    if(s.done){
      clearInterval(timer);
      stage.innerText="Ready";
      lastVideo=s.videoUrl;

      downloadBtn.onclick=()=>{
        if(lastVideo) window.open(lastVideo,"_blank");
      };
    }
  },2000);

 }catch(e){
   alert(e.message);
   stage.innerText="Ready";
 }
}

function newVideo(){
 prompt.value="";
 img.value="";
 stage.innerText="Ready";
 percent.innerText="0%";
 bar.value=0;
 eta.innerText="0 sec";
 lastVideo="";
}
</script>

</body>
</html>
