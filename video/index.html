
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wan 2.1 AI Video</title>
<style>
body{background:#0b1020;color:#fff;font-family:Arial;padding:20px}
h2{color:#7c3aed}
input,textarea,button{width:100%;margin:10px 0;padding:12px;border-radius:10px;border:0}
textarea{height:120px}
button{background:#7c3aed;color:#fff;font-weight:bold}
#status,#out{margin-top:15px;white-space:pre-wrap}
</style>
</head>
<body>

<h2>🎬 Wan 2.1 AI Video</h2>

<input id="img" placeholder="Image URL (optional)">
<textarea id="prompt" placeholder="Describe your cinematic video..."></textarea>

<button onclick="gen()">Generate Video</button>
<button onclick="newVideo()">New Video</button>

<div id="status"></div>
<div id="out"></div>

<script>
let lastVideo="", lastJob="";

async function gen(){
 const status=document.getElementById("status");
 const out=document.getElementById("out");

 status.innerHTML="⏳ Starting...";
 out.innerHTML="";

 const r=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     prompt:document.getElementById("prompt").value,
     image:document.getElementById("img").value
   })
 });

 const d=await r.json();
 lastJob=d.name;

 const timer=setInterval(async()=>{
   const s=await (await fetch("/api/status?id="+lastJob)).json();

   status.innerHTML=
   `🎬 ${s.stage}
${s.progress}% | ETA ${s.eta}s`;

   if(s.done){
     clearInterval(timer);
     lastVideo=s.videoUrl;
     out.innerHTML=
     `<a href="${lastVideo}" target="_blank" style="color:#7dd3fc">⬇ Download MP4</a>`;
   }
 },2000);
}

function newVideo(){
 lastVideo="";
 lastJob="";
 document.getElementById("prompt").value="";
 document.getElementById("img").value="";
 document.getElementById("status").innerHTML="";
 document.getElementById("out").innerHTML="";
}
</script>

</body>
</html>
