<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wan 2.1 Studio</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#07142b;color:#fff;font-family:Arial,sans-serif;padding:16px}
    .card{background:#10224b;border-radius:18px;padding:14px;margin-bottom:14px}
    h1{font-size:26px;margin-bottom:14px}
    .tabs{display:flex;gap:8px}
    .tab{flex:1;padding:10px;border:none;border-radius:10px;background:#1a2d63;color:#fff}
    .active{background:#6c4cff}
    textarea,input,select{width:100%;padding:12px;border:none;border-radius:10px;background:#1a2d63;color:#fff;margin-top:8px}
    textarea{height:110px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;color:#fff;margin-top:10px;font-size:16px}
    .purple{background:#6c4cff}
    .green{background:#00c853}
    .orange{background:#ff9800}
    .red{background:#e53935}
    .preview{width:100%;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#243b74,#0d1630);display:flex;align-items:center;justify-content:center;font-size:48px}
    progress{width:100%;height:10px}
    .row{display:flex;justify-content:space-between;margin:8px 0}
  </style>
</head>
<body>

  <h1>🎬 Wan 2.1 Studio</h1>

  <div class="card">
    <div class="tabs">
      <button class="tab active">2D</button>
      <button class="tab">3D</button>
      <button class="tab">Anime</button>
    </div>
  </div>

  <div class="card">
    <h3>Prompt</h3>
    <textarea id="prompt" placeholder="Describe your cinematic video..."></textarea>
    <input id="image" placeholder="Reference Image URL (optional)">
  </div>

  <div class="card">
    <h3>Video Settings</h3>
    <div class="grid">
      <select id="resolution">
        <option>360P</option>
        <option>720P</option>
        <option selected>1080P</option>
      </select>
      <select id="fps">
        <option selected>24 FPS</option>
        <option>30 FPS</option>
      </select>
      <select id="duration">
        <option selected>8 sec</option>
        <option>6 sec</option>
        <option>4 sec</option>
      </select>
      <select id="aspect">
        <option selected>16:9</option>
        <option>9:16</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h3>🎤 Voice Clone</h3>
    <input type="file" accept=".wav,.mp3">
  </div>

  <button class="btn purple" onclick="startGen()">🎬 Generate Video</button>
  <button class="btn purple" onclick="alert('Extend जल्द आएगा')">➕ Extend Video</button>

  <div class="grid">
    <button class="btn green" onclick="downloadVideo()">⬇ Download</button>
    <button class="btn orange" onclick="resetUI()">🆕 New</button>
  </div>

  <button class="btn red" onclick="resetUI()">🗑 Delete</button>

  <div class="card">
    <h3>Status Video</h3>
    <div class="preview" id="preview">🎥</div>

    <div class="row">
      <span id="stage">Ready</span>
      <span id="percent">0%</span>
    </div>

    <progress id="bar" value="0" max="100"></progress>
    <p style="margin-top:8px">ETA: <span id="eta">0 sec</span></p>
  </div>

  <script src="/script.js"></script>
</body>
</html>
