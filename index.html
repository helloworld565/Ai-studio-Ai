<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wan 2.1 Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07142b;color:#fff;font-family:Arial;padding:16px}
.card{background:#10224b;border-radius:18px;padding:14px;margin-bottom:14px}
h1{font-size:28px;margin-bottom:12px}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px;border:none;border-radius:10px;background:#1a2d63;color:#fff}
.active{background:#6c4cff}
textarea,input,select{width:100%;padding:12px;border:none;border-radius:10px;background:#1a2d63;color:#fff;margin-top:8px}
textarea{height:110px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;color:#fff;margin-top:10px}
.purple{background:#6c4cff}.green{background:#00c853}.orange{background:#ff9800}.red{background:#e53935}
.preview{width:100%;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#243b74,#0d1630);display:flex;align-items:center;justify-content:center;font-size:48px}
progress{width:100%;height:10px}
.row{display:flex;justify-content:space-between;margin:8px 0}
</style>
</head>
<body>

<h1>🎬 Wan 2.1 Studio</h1>

<div class="card">
  <div class="tabs">
    <button class="tab active">2D</button>
    <button class="tab">3D</button>
    <button class="tab">Anime</button>
  </div>
</div>

<div class="card">
  <h3>Prompt</h3>
  <textarea id="prompt" placeholder="Describe your cinematic video..."></textarea>
  <input id="image" placeholder="Reference Image URL (optional)">
</div>

<div class="card">
  <h3>Video Settings</h3>
  <div class="grid">
    <select><option>360P</option><option>720P</option><option selected>1080P</option><option>4K</option></select>
    <select><option selected>24 FPS</option><option>30 FPS</option><option>60 FPS</option></select>
    <select><option>8 sec</option><option>12 sec</option><option>16 sec</option></select>
    <select><option>9:16</option><option selected>16:9</option><option>1:1</option></select>
  </div>
</div>

<div class="card">
  <h3>🎤 Voice Clone</h3>
  <input type="file" accept=".wav,.mp3">
</div>

<button class="btn purple" onclick="startGen()">🎬 Generate Video</button>
<button class="btn purple">➕ Extend Video</button>

<div class="grid">
  <button class="btn green">⬇ Download</button>
  <button class="btn orange" onclick="resetUI()">🆕 New</button>
</div>

<button class="btn red" onclick="resetUI()">🗑 Delete</button>

<div class="card">
  <h3>Status Video</h3>
  <div class="preview" id="preview">🎥</div>

  <div class="row">
    <span id="stage">Ready</span>
    <span id="percent">0%</span>
  </div>

  <progress id="bar" value="0" max="100"></progress>

  <p style="margin-top:8px">ETA: <span id="eta">0 sec</span></p>
</div>

<script>
const stages=[
["Queued",5,180,"🟡"],
["Analyzing Prompt",18,150,"🧠"],
["Creating Storyboard",35,120,"📝"],
["Rendering Frames",60,70,"🎨"],
["Animating Motion",82,30,"🎬"],
["Encoding MP4",96,8,"📦"],
["Complete",100,0,"✅"]
];

let i=0,timer;

function startGen(){
 clearInterval(timer);
 i=0;
 update();
 timer=setInterval(()=>{
   i++;
   if(i>=stages.length){
     clearInterval(timer);
     return;
   }
   update();
 },2500);
}

function update(){
 const s=stages[i];
 stage.innerText=s[0];
 percent.innerText=s[1]+"%";
 bar.value=s[1];
 eta.innerText=s[2]+" sec";
 preview.innerText=s[3];
}

function resetUI(){
 clearInterval(timer);
 stage.innerText="Ready";
 percent.innerText="0%";
 bar.value=0;
 eta.innerText="0 sec";
 preview.innerText="🎥";
 prompt.value="";
 image.value="";
}
</script>

</body>
</html>
